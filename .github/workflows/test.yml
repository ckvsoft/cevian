# Der Name Ihres Workflows
name: Test Changelog Generation

# Wann der Workflow ausgeführt werden soll (z.B. bei Tag-Push)
on:
  push:
    tags:
      - 'v*.*.*'

# Die Jobs, die ausgeführt werden sollen
jobs:
  changelog: # Name des Jobs
    runs-on: ubuntu-latest
    
    steps: # Hier muss die Einrückung beginnen
      
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true 

      - name: Generate v0.8.0 Changelog to Test File # Dies ist der fehlerhafte Block
        uses: TriPSs/conventional-changelog-action@v6.1.0
        with: # WICHTIG: 'with:' muss genau unter 'uses:' stehen
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-file: TEST_CHANGELOG.md 
          base-ref: v0.6.6 
          head-ref: v0.8.0 
          version: 0.8.0
          release-count: 1 
          skip-tag: true
          skip-git-pull: true
          skip-version-file: true
          git-push: false 
          
      - name: Display Test Changelog # Dieser Schritt ist korrekt unter 'steps:' eingerückt
        run: |
          echo "--- Inhalt von TEST_CHANGELOG.md ---"
          cat TEST_CHANGELOG.md
          echo "------------------------------------"
