name: Automatic Changelog & Tagging

on:
  push:
    # NEUE ZEILE: Reaktion auf Commits im 'main' (oder 'master') Branch
    branches:
      - main 
  workflow_dispatch:

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true 

      - name: Generate Changelog and Create Tag 🚀
        uses: TriPSs/conventional-changelog-action@v6.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # 🛑 NEU: 'skip-tag' entfernen oder auf 'false' setzen
          # Die Action berechnet jetzt v0.8.3 oder v0.9.0 und erstellt den Tag!
          # skip-tag: true # DIESE ZEILE ENTFERNEN
          git-push: true
          skip-version-file: true
          skip-git-pull: true 
          # 🛑 NEU: 'skip-on-empty' auf false setzen, um sicherzustellen, dass ein Changelog erzeugt wird, selbst wenn es nur ein kleines Update ist.
          skip-on-empty: false
